spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hamsetech}
    username: ${DB_USERNAME:hamsetech}
    password: ${DB_PASSWORD:hamsetech}

security:
  # 개발 전용 키다. 운영 환경에서는 반드시 JWT_SECRET을 주입한다.
  jwt:
    secret: ${JWT_SECRET:development-only-secret-must-never-be-used-in-production}

admin:
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
  username: ${ADMIN_USERNAME:admin}
  email: ${ADMIN_EMAIL:admin@example.com}
  password: ${ADMIN_PASSWORD:admin1234}
  seed-sample-data: ${ADMIN_SEED_SAMPLE_DATA:true}
