spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hamsetech}
    username: ${DB_USERNAME:hamsetech}
    password: ${DB_PASSWORD:hamsetech}

security:
  # 개발 전용 키다. 운영 환경에서는 반드시 JWT_SECRET을 주입한다.
  jwt:
    secret: ${JWT_SECRET:development-only-secret-must-never-be-used-in-production}

admin:
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
  username: ${ADMIN_USERNAME:admin}
  email: ${ADMIN_EMAIL:admin@example.com}
  password: ${ADMIN_PASSWORD:admin1234}
  seed-sample-data: ${ADMIN_SEED_SAMPLE_DATA:true}

# CORS는 개발 환경에서만 필요하다. 운영은 Nginx가 프론트와 /api를 같은 오리진으로
# 묶어 주므로 브라우저가 교차 오리진 요청을 아예 만들지 않는다.
# 개발은 Vite(5173)와 백엔드(8080)가 따로 뜨고, 사설망 IP로 접속해 폰·다른 PC에서
# 확인하는 일이 잦다. 브라우저는 192.168.x.x로 연 화면을 localhost와 다른 오리진으로
# 보기 때문에 여기에 명시하지 않으면 preflight가 403 Invalid CORS request로 끊긴다.
app:
  cors:
    # 운영이 읽는 CORS_ALLOWED_ORIGINS와 이름을 일부러 분리했다. 두 compose 파일이
    # 같은 .env를 공유해서, 이름이 같으면 개발용으로 넣은 사설망 오리진이
    # 운영 배포까지 그대로 따라간다.
    # 사설망 대역이 다른 곳에서 개발한다면 DEV_CORS_ALLOWED_ORIGINS로 덮어쓴다.
    allowed-origins: ${DEV_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.0.30:*}
