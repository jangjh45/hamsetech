# =============================================
# docker-compose.nas.yml - Synology DS218+ 오버레이
#
# docker-compose.prod.yml 위에 얹어서 쓴다. 단독으로는 동작하지 않는다.
#   docker compose -f docker-compose.prod.yml -f docker-compose.nas.yml up -d
#
# 왜 필요한가: prod 파일의 메모리 한도 합계는 3.25GB(postgres 1g + backend 2g +
# frontend 256m)인데 DS218+의 물리 RAM은 2GB다. DSM 자체가 700~800MB를 쓰므로
# 컨테이너에 남는 것은 1.1~1.2GB뿐이다. 그대로 올리면 컨테이너 한도에 닿기 전에
# 호스트 OOM 킬러가 먼저 프로세스를 죽인다 - JVM이 OOM을 인지하지 못하므로
# Dockerfile의 ExitOnOutOfMemoryError도 소용이 없다.
#
# 이 파일은 세 컨테이너의 실제 RSS 합계를 ~780MB로 낮춘다.
# =============================================

services:
  postgres:
    # 기본값(shared_buffers 128MB, max_connections 100)은 이 하드웨어에 과하다.
    # 커넥션 하나당 work_mem이 따로 잡히므로 max_connections를 먼저 줄여야
    # 최악의 경우 사용량이 예측 가능해진다. Hikari 풀 5개 + 헬스체크면 20으로 충분하다.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      # 커널 페이지 캐시까지 포함한 "쓸 수 있는 캐시" 추정치. 플래너 힌트일 뿐
      # 실제로 할당하지 않는다. 2GB 머신이므로 보수적으로 잡는다.
      - -c
      - effective_cache_size=192MB
    deploy:
      resources:
        limits:
          memory: 320m

  backend:
    # 이미지 태그를 명시해 둔다. PC에서 이 태그로 빌드해 NAS로 옮기고, NAS에서는
    # 이 태그가 로컬에 이미 있으므로 compose가 빌드를 건너뛴다.
    # (compose에는 "빌드 금지" 플래그가 없다. up 전에 docker images로 확인할 것.)
    image: hamsetech-backend:nas
    environment:
      # Dockerfile의 ENTRYPOINT에 박힌 -XX:MaxRAMPercentage=75.0은 여기서 바꿀 수 없다.
      # JAVA_TOOL_OPTIONS는 명령줄보다 "먼저" 처리되므로 같은 -XX 플래그를 넣어도
      # ENTRYPOINT 쪽이 이긴다. 대신 -Xmx를 준다: MaxRAMPercentage는 -Xmx가
      # 지정되지 않았을 때의 기본 힙을 계산하는 값이라, -Xmx가 있으면 무시된다.
      #
      # TieredStopAtLevel=1은 C2 JIT을 끈다. J3355에서 콜드 스타트가 눈에 띄게
      # 빨라지고 코드 캐시도 작아진다. 피크 처리량은 손해지만 공지 게시판 수준의
      # 부하에서는 체감되지 않는다.
      #
      # 기동 시 stderr에 "Picked up JAVA_TOOL_OPTIONS: ..." 한 줄이 찍힌다. 정상이다.
      JAVA_TOOL_OPTIONS: >-
        -Xmx384m
        -XX:MaxMetaspaceSize=192m
        -XX:TieredStopAtLevel=1
      # Postgres의 max_connections=20에 맞춰 풀을 줄인다. 기본 10은 이 규모에서
      # 놀고 있는 커넥션만 늘린다.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
    # 힙 384m + 메타스페이스 192m + 스레드/코드캐시/다이렉트버퍼 ~100m = 최대 ~680m.
    # 800m는 그 위의 안전 여유다. 이보다 더 조이면 cgroup OOM으로 죽는다.
    #
    # cpus를 0으로 덮어써서 prod의 cpus: "2.0"을 무효화한다. 시놀로지 커널에는
    # CFS 쿼타(cpu.cfs_quota_us)가 빠져 있어 CPU 한도를 걸면 컨테이너 생성이
    # "NanoCPUs can not be set, as your kernel does not support CPU CFS scheduler"로
    # 실패한다. compose는 0인 cpus를 병합 결과에서 아예 빼므로 한도 없이 뜬다.
    # 애초에 2코어 머신에서 2.0 제한은 아무 효과가 없어 잃는 것도 없다.
    # (오버라이드 파일은 키를 지울 수 없다. !reset은 compose v2.24+ 전용이라
    #  구형 Container Manager에서 깨진다.)
    deploy:
      resources:
        limits:
          memory: 800m
          cpus: "0"
    # prod의 start_period 60s는 J3355에 부족하다. Flyway 마이그레이션이 도는
    # 첫 기동은 90초를 넘기기도 하는데, 그러면 retries를 다 태우고 unhealthy가 되어
    # depends_on(service_healthy)에 걸린 frontend가 영영 뜨지 않는다.
    healthcheck:
      start_period: 150s

  frontend:
    image: hamsetech-frontend:nas
    # Nginx 정적 서빙의 실제 사용량은 15MB 남짓이다. 256m는 이 머신에서 낭비다.
    deploy:
      resources:
        limits:
          memory: 64m
