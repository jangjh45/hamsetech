name: Dependency Review

# 새 PR이 심각한 취약 의존성을 들여오는 것만 막는다.
# 이미 들어와 있는 부채는 건드리지 않는다(base와 head의 차이만 본다).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
