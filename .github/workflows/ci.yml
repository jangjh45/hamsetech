name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # push/PR 없이도 손으로 다시 돌릴 수 있게 한다
  workflow_dispatch:

# 코드를 읽어 빌드·테스트만 한다. 레지스트리 푸시나 PR 코멘트가 없어 이걸로 충분하다.
permissions:
  contents: read

# 같은 PR에 새 커밋이 오면 이전 실행을 취소한다. 최신 커밋만 검증하면 된다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # gradle-wrapper.jar가 저장소에 커밋되어 있고 CI가 그걸 실행한다.
      # 공식 배포본과 체크섬이 같은지 확인한다.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # .gitattributes가 gradlew를 eol=lf로 고정해 개행은 안전하지만,
      # 실행 비트는 git 인덱스 모드에 달려 있어 별개다. 이미 맞아도 무해하다.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # build = assemble(jar·bootJar) + check(test).
      # test를 따로 부르면 의도만 흐려지므로 한 번만 호출한다.
      # 서비스 컨테이너로 PostgreSQL을 띄우지 않는다. 쓰는 테스트가 없다.
      # HamsetechApplicationTests는 @SpringBootTest(properties)로 H2를 못 박고,
      # SchemaMigrationTest는 Testcontainers가 자기 PostgreSQL을 띄운다.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 버전 출처는 frontend/.nvmrc 하나로 모은다.
      # frontend/Dockerfile의 node:22-alpine과 같이 움직여야 한다.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          # defaults.working-directory는 uses: 스텝에 적용되지 않는다.
          # 저장소 루트 기준 경로를 그대로 적어야 한다.
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # lint가 빌드보다 훨씬 빨라 먼저 둔다
      - name: Lint
        run: npm run lint

      # tsc -b && vite build. 타입 오류와 번들 오류를 함께 잡는다.
      - name: Build
        run: npm run build
