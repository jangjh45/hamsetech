name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 코드를 읽어 빌드·테스트만 한다. 레지스트리 푸시나 PR 코멘트가 없어 이걸로 충분하다.
permissions:
  contents: read

# 같은 PR에 새 커밋이 오면 이전 실행을 취소한다. 최신 커밋만 검증하면 된다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # HamsetechApplicationTests가 @SpringBootTest라 전체 컨텍스트가 뜨고,
    # 그러려면 실제 PostgreSQL이 있어야 한다. application.yml의 기본값
    # (hamsetech/hamsetech/hamsetech, 5432)에 맞춰 두면 시크릿도 테스트 전용
    # 프로파일도 없이 그대로 붙는다.
    services:
      postgres:
        image: postgres:16-alpine # docker-compose.yml과 같은 버전
        env:
          POSTGRES_DB: hamsetech
          POSTGRES_USER: hamsetech
          POSTGRES_PASSWORD: hamsetech
        ports:
          - 5432:5432
        # 헬스체크가 없으면 컨테이너가 뜨자마자 스텝이 시작돼 첫 커넥션이 깨진다
        options: >-
          --health-cmd "pg_isready -U hamsetech -d hamsetech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # gradle-wrapper.jar가 저장소에 커밋되어 있고 CI가 그걸 실행한다.
      # 공식 배포본과 체크섬이 같은지 확인한다.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # .gitattributes가 gradlew를 eol=lf로 고정해 개행은 안전하지만,
      # 실행 비트는 git 인덱스 모드에 달려 있어 별개다. 이미 맞아도 무해하다.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # build = assemble(jar·bootJar) + check(test).
      # test를 따로 부르면 의도만 흐려지므로 한 번만 호출한다.
      - name: Build and test
        env:
          # application.yml 기본값과 같은 값이지만, 기본값이 바뀌었을 때
          # CI가 조용히 다른 DB를 보지 않도록 명시한다. 시크릿은 쓰지 않는다.
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: hamsetech
          DB_USERNAME: hamsetech
          DB_PASSWORD: hamsetech
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 버전 고정 파일(.nvmrc/engines)이 없어 frontend/Dockerfile의
      # node:22-alpine에 맞춘다. 나중에 .nvmrc를 두면 node-version-file로 옮길 것.
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          # defaults.working-directory는 uses: 스텝에 적용되지 않는다.
          # 저장소 루트 기준 경로를 그대로 적어야 한다.
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # lint가 빌드보다 훨씬 빨라 먼저 둔다
      - name: Lint
        run: npm run lint

      # tsc -b && vite build. 타입 오류와 번들 오류를 함께 잡는다.
      - name: Build
        run: npm run build
