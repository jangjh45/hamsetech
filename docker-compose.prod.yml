# =============================================
# docker-compose.prod.yml - 프로덕션 환경
# 사용법: docker compose -f docker-compose.prod.yml up --build -d
# 접속: http://<호스트>:${FRONTEND_HOST_PORT:-8080}  (NAS 등에서 80 충돌 시 기본 8080)
# =============================================

name: hamsetech-prod

services:
  # ── PostgreSQL ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hamsetech-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-hamsetech}
      POSTGRES_USER: ${DB_USERNAME:-hamsetech}
      # :? 는 값이 비면 컨테이너를 만들기 전에 compose를 중단시킨다.
      # 기본값 없는 ${DB_PASSWORD}는 경고만 내고 빈 문자열을 주입해 버린다.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정하세요}
    expose:
      - "5432"                             # 외부 포트 미노출 (내부 통신만)
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hamsetech} -d ${DB_NAME:-hamsetech}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - backend-net

  # ── Backend (Spring Boot) ───────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod              # prod 스테이지 사용 (경량 이미지)
    container_name: hamsetech-backend
    restart: always
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-hamsetech}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-hamsetech}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정하세요}
      JWT_SECRET: ${JWT_SECRET:?.env에 JWT_SECRET을 설정하세요}
      # ADMIN_*은 일부러 :? 를 걸지 않는다. 최초 기동 뒤
      # ADMIN_BOOTSTRAP_ENABLED=false로 내리면 정당하게 비어 있어도 되기 때문이다.
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # 첫 기동에서만 관리자 계정을 만든다. 기존 계정은 절대 변경하지 않는다.
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-true}
      ADMIN_SEED_SAMPLE_DATA: "false"
      UPLOAD_DIR: /app/uploads
      # 스키마는 Flyway가 만들고 Hibernate는 검증만 한다.
      # Flyway를 처음 붙이는 배포에서 ddl-auto=update가 남긴 드리프트가 validate에
      # 걸리면, 한 번만 none으로 띄워 마이그레이션을 적용한 뒤 되돌린다.
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-validate}
      # Nginx가 앞단에서 X-Forwarded-*를 덮어쓰므로 이 배포에서는 헤더를 신뢰할 수 있다.
      # 감사 로그에 실제 클라이언트 IP가 남으려면 필요하다.
      FORWARD_HEADERS_STRATEGY: framework
    expose:
      - "8080"                             # 외부 포트 미노출 (Nginx가 내부 연결)
    volumes:
      - notice_uploads:/app/uploads        # 공지 첨부파일. 컨테이너를 다시 만들어도 남는다
    depends_on:
      postgres:
        condition: service_healthy
    # wget은 alpine busybox 내장이라 jre-alpine에도 있다.
    # /actuator/health는 application.yml에서 노출 범위에 못 박혀 있다.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Flyway 마이그레이션이 도는 첫 기동에서 retries를 다 태우고
      # unhealthy로 떨어지지 않도록 유예를 준다.
      start_period: 60s
    # Dockerfile의 MaxRAMPercentage=75.0이 의미를 가지려면 한도가 있어야 한다.
    # 한도가 없으면 컨테이너가 아니라 호스트 RAM의 75%를 잡는다.
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    networks:
      - backend-net
      - frontend-net

  # ── Frontend (Nginx + React 빌드) ────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod              # prod 스테이지 = Nginx
    container_name: hamsetech-frontend
    restart: always
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"   # 호스트 80(NAS 등) 충돌 회피, .env로 변경 가능
    depends_on:
      backend:
        # 조건 없는 depends_on이면 Nginx가 먼저 떠서 초기 요청이 502가 된다.
        condition: service_healthy
    # localhost가 아니라 127.0.0.1이어야 한다. 컨테이너 안에서 localhost는
    # ::1로 먼저 풀리는데 nginx.conf의 "listen 80;"은 IPv4만 듣는다.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - frontend-net

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
  # 공지 첨부파일 원본. DB 백업에 포함되지 않으므로 따로 백업해야 한다.
  notice_uploads:
    driver: local
