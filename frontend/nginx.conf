server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # 정적 파일 캐시
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 프록시 → Spring Boot backend
    location /api/ {
        # 기본값이 1MB라, 이 설정이 없으면 그보다 큰 공지 첨부는 백엔드에 닿지도 못하고
        # nginx가 413으로 끊는다. 백엔드의 multipart 상한(30MB)과 맞춰 둔다.
        client_max_body_size 30m;

        proxy_pass http://backend:8080;
        # $host가 아니라 $http_host여야 한다. $host는 포트를 떼어내므로,
        # 8080처럼 비표준 포트로 게시하면 백엔드가 자기 오리진을 http://<호스트>(:80)로
        # 재구성한다. 브라우저가 보내는 Origin은 http://<호스트>:8080이라 포트가 어긋나고,
        # Spring이 이걸 교차 오리진 요청으로 판정해 "Invalid CORS request" 403을 낸다.
        # 같은 오리진 GET에는 Origin이 안 붙으므로 화면은 뜨고 POST(로그인)만 깨진다.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 포트를 명시적으로도 넘긴다. forward-headers-strategy=framework인 백엔드는
        # X-Forwarded-Host를 Host 헤더보다 우선해 읽는다.
        # X-Forwarded-Port를 $server_port로 주면 안 된다 - 컨테이너 안의 nginx는
        # 80을 듣고 있어 게시 포트(8080)가 아니라 80이 실린다.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # React SPA 라우팅 (모든 경로를 index.html로)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
